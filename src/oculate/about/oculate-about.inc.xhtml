<?csp default-src chrome: resource:; object-src 'none'; ?>

<window xmlns:html="http://www.w3.org/1999/xhtml"
        xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
        id="oculate-about-dialog"
        windowtype="Browser:About"
#ifndef XP_MACOSX
        data-l10n-id="oculate-about-dialog-title"
#endif
        role="dialog"
        aria-describedby="oculate-about-version-text oculate-about-firefox-version oculate-about-update-text">
#ifdef XP_MACOSX
#include ../../browser/base/content/macWindow.inc.xhtml
#else
  <script src="chrome://browser/content/utilityOverlay.js"/>
#endif

  <linkset>
    <html:link rel="stylesheet" href="chrome://global/skin/global.css"/>
    <html:link rel="stylesheet" href="chrome://browser/content/oculate-styles/oculate-about.css"/>

    <html:link rel="localization" href="branding/brand.ftl"/>
    <html:link rel="localization" href="browser/oculate-about.ftl"/>
  </linkset>

  <html:main id="oculate-about-content">
    <html:img id="oculate-about-logo" src="chrome://branding/content/about-logo.svg" alt="" draggable="false"/>
    <html:h1 id="oculate-about-name" data-l10n-id="oculate-about-app-name"/>
    <html:p id="oculate-about-version" class="oculate-about-muted" role="button" tabindex="0" data-l10n-id="oculate-about-version-button">
      <html:span id="oculate-about-version-text"/>
      <html:span id="oculate-about-copied" data-l10n-id="oculate-about-copied" hidden="hidden"/>
    </html:p>
    <html:p id="oculate-about-firefox-version" class="oculate-about-muted"/>

    <html:section id="oculate-about-update" data-state="never-checked" aria-live="polite">
      <html:div id="oculate-about-update-status">
        <html:img id="oculate-about-update-icon" alt=""/>
        <html:p id="oculate-about-update-text"/>
      </html:div>
      <html:button id="oculate-about-update-button" hidden="hidden"/>
    </html:section>

    <html:footer id="oculate-about-footer">
      <html:p id="oculate-about-community" class="oculate-about-muted" data-l10n-id="oculate-about-community">
        <html:a data-l10n-name="github-link" href="https://github.com/Hexadrocatch/oculate2"/>
      </html:p>
      <html:div id="oculate-about-link-group">
        <html:nav id="oculate-about-links" class="oculate-about-muted">
          <html:a id="oculate-about-release-notes" href="" data-l10n-id="oculate-about-release-notes"/>
          <html:a id="oculate-about-issues" href="https://github.com/Hexadrocatch/oculate2/issues" data-l10n-id="oculate-about-report-issue"/>
        </html:nav>
        <html:nav id="oculate-about-legal" class="oculate-about-muted">
          <html:a href="about:license" data-l10n-id="oculate-about-license"/>
          <html:a href="about:rights" data-l10n-id="oculate-about-rights"/>
        </html:nav>
      </html:div>
    </html:footer>
  </html:main>

  <keyset>
    <key id="oculate-about-escape-key" keycode="VK_ESCAPE"/>
  </keyset>

  <script src="chrome://browser/content/oculate-components/windows/oculate-about.js"/>
</window>

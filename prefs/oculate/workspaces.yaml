- name: oculate.workspaces.continue-where-left-off
  value: false

- name: oculate.workspaces.hide-default-container-indicator
  value: true

- name: oculate.workspaces.force-container-workspace
  value: false

# New profiles start without Firefox's Personal/Work/Banking/Shopping containers.
- name: oculate.containers.create-default-identities
  value: false

- name: oculate.workspaces.open-new-tab-if-last-unpinned-tab-is-closed
  value: false

- name: oculate.workspaces.swipe-actions
  value: true

- name: oculate.workspaces.swipe-actions.delta-multiplier
  value: 100

- name: oculate.workspaces.swipe-actions.edge-actions
  value: true

- name: oculate.workspaces.switch-animation-duration
  value: 250

- name: oculate.workspaces.wrap-around-navigation
  value: true

- name: oculate.workspaces.natural-scroll
  value: false

- name: oculate.workspaces.scroll-modifier-key
  value: ctrl

- name: oculate.workspaces.separate-essentials
  value: true

- name: oculate.workspaces.dnd-switch-padding
  value: 20

- name: oculate.workspaces.debug
  value: "@cond"
  condition: "!defined(MOZILLA_OFFICIAL)" # Section: Pinned tabs management

- name: oculate.pinned-tab-manager.wheel-close-if-pending
  value: true

- name: oculate.pinned-tab-manager.debug
  value: false

- name: oculate.pinned-tab-manager.restore-pinned-tabs-to-pinned-url
  value: false

- name: oculate.pinned-tab-manager.close-shortcut-behavior
  value: reset-unload-switch

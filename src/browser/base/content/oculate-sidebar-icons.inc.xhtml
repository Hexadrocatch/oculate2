<toolbar brighttext="true"
  id="oculate-sidebar-foot-buttons"
  fullscreentoolbar="true"
  class="browser-toolbar customization-target"
  data-l10n-id="tabs-toolbar"
  customizable="true"
  skipintoolbarset="true"
  context="toolbar-context-menu"
  mode="icons">
  <toolbarbutton removable="true" class="chromeclass-toolbar-additional toolbarbutton-1 oculate-sidebar-action-button" id="oculate-expand-sidebar-button" command="cmd_oculateToggleSidebar" data-l10n-id="sidebar-oculate-expand"></toolbarbutton>
  <oculate-workspace-icons id="oculate-workspaces-button" overflows="false" removable="false"></oculate-workspace-icons>
  <toolbarbutton removable="true" class="chromeclass-toolbar-additional toolbarbutton-1 oculate-sidebar-action-button" id="oculate-create-new-button" context="oculateCreateNewPopup" data-l10n-id="sidebar-oculate-create-new"></toolbarbutton>
</toolbar>

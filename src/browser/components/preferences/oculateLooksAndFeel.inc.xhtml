<script type="text/javascript" src="chrome://browser/content/preferences/oculate-settings.js"/>
<html:template id="template-paneOculateLooks">

<hbox id="oculateVerticalTabsCategory"
      class="subcategory"
      hidden="true"
      data-category="paneOculateLooks">
<html:h1 data-l10n-id="oculate-vertical-tabs-title"/>
</hbox>

<groupbox id="oculateVerticalTabsGroup" data-category="paneOculateLooks" hidden="true" class="highlighting-group">
  <label><html:h2 data-l10n-id="oculate-vertical-tabs-layout-header"/></label>
    <description class="description-deemphasized" data-l10n-id="oculate-vertical-tabs-layout-description" />
    <hbox id="oculateLayoutList">
      <hbox layout="single">
        <html:img src="chrome://browser/content/oculate-images/layouts/single-toolbar.png" />
        <label data-l10n-id="oculate-layout-single-toolbar"></label>
      </hbox>
      <hbox layout="multiple">
        <html:img src="chrome://browser/content/oculate-images/layouts/multiple-toolbar.png" />
        <label data-l10n-id="oculate-layout-multiple-toolbar"></label>
      </hbox>
      <hbox layout="collapsed">
        <html:img src="chrome://browser/content/oculate-images/layouts/collapsed.png" />
        <label data-l10n-id="oculate-layout-collapsed-toolbar"></label>
      </hbox>
    </hbox>
  <label><html:h2 data-l10n-id="oculate-vertical-tabs-header"/></label>
      <description class="description-deemphasized" data-l10n-id="oculate-vertical-tabs-description" />

      <checkbox id="oculateLooksAndFeelNewtabUnderLastTab"
            data-l10n-id="oculate-vertical-tabs-newtab-on-tab-list"
            preference="oculate.tabs.show-newtab-vertical"/>
    <vbox class="indent">
        <checkbox id="oculateLooksAndFeelMoveNewtabToTop"
                data-l10n-id="oculate-vertical-tabs-newtab-top-button-up"
                preference="oculate.view.show-newtab-button-top"/>
    </vbox>
    <html:div data-l10n-id="preferences-web-appearance-footer">
        <html:a id="web-appearance-manage-themes-link" class="text-link" data-l10n-name="themes-link" href="about:addons" target="_blank" />
    </html:div>
</groupbox>

<hbox id="oculateThemeCategory"
      class="subcategory"
      hidden="true"
      data-category="paneOculateLooks">
<html:h1 data-l10n-id="pane-oculate-theme-title"/>
</hbox>

<groupbox id="oculateThemeGroup" data-category="paneOculateLooks" hidden="true" class="highlighting-group">
      <label><html:h2 data-l10n-id="oculate-look-and-feel-compact-view-header"/></label>
      <description class="description-deemphasized" data-l10n-id="oculate-look-and-feel-compact-view-description" />

      <vbox class="indent">
            <checkbox id="oculateLooksAndFeelEnableToolbarFlashPopup"
                      data-l10n-id="oculate-look-and-feel-compact-toolbar-flash-popup"
                      preference="oculate.view.compact.toolbar-flash-popup"/>
      </vbox>

      <label><html:h2 data-l10n-id="oculate-look-and-feel-window-drag-header"/></label>
      <description class="description-deemphasized" data-l10n-id="oculate-look-and-feel-window-drag-description" />

      <vbox class="indent">
            <checkbox id="oculateLooksAndFeelWindowDragEnabled"
                  data-l10n-id="oculate-window-drag-enabled"
                  preference="oculate.view.drag-window-from-content"/>
      </vbox>
</groupbox>

<hbox id="oculateGlanceCategory"
      class="subcategory"
      hidden="true"
      data-category="paneOculateLooks">
<html:h1 data-l10n-id="oculate-glance-title"/>
</hbox>

<groupbox id="oculateGlanceGroup" data-category="paneOculateLooks" hidden="true" class="highlighting-group">
      <label><html:h2 data-l10n-id="oculate-glance-header"/></label>
      <description class="description-deemphasized" data-l10n-id="oculate-glance-description" />

      <checkbox id="oculateLooksAndFeelGlanceEnabled"
            data-l10n-id="oculate-glance-enabled"
            preference="oculate.glance.enabled"/>
      <hbox align="center">
            <label id="oculateGlanceTriggerLabel" data-l10n-id="oculate-glance-trigger-label"/>
            <menulist id="oculateGlanceTrigger" preference="oculate.glance.activation-method">
                  <menupopup>
                        <menuitem data-l10n-id="oculate-glance-trigger-ctrl-click" value="ctrl"/>
                        <menuitem data-l10n-id="oculate-glance-trigger-alt-click" value="alt"/>
                        <menuitem data-l10n-id="oculate-glance-trigger-shift-click" value="shift"/>
#ifdef XP_MACOSX
                        <menuitem data-l10n-id="oculate-glance-trigger-meta-click" value="meta"/>
#endif
                  </menupopup>
            </menulist>
        </hbox>
</groupbox>

</html:template>

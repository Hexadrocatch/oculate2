<!DOCTYPE window>

<window
  xmlns:html="http://www.w3.org/1999/xhtml"
  xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
  id="oculateBoostReceiveDialog">
  <dialog
    class="zbs-dialog"
    buttons="accept,cancel"
    data-l10n-id="oculate-boost-receive-dialog"
    data-l10n-attrs="buttonlabelaccept,buttonlabelcancel">
    <linkset>
      <html:link rel="stylesheet" href="chrome://global/skin/global.css" />
      <html:link rel="stylesheet" href="chrome://browser/content/oculate-styles/oculate-theme.css" />
      <html:link rel="stylesheet" href="chrome://browser/content/oculate-styles/oculate-boosts-share.css" />
      <html:link rel="stylesheet" href="chrome://browser/skin/oculate-icons/icons.css" />
      <html:link rel="stylesheet" href="chrome://browser/content/oculate-styles/oculate-popup.css" />
      <html:link rel="stylesheet" href="chrome://browser/content/oculate-styles/oculate-panel-ui.css" />
      <html:link rel="localization" href="browser/oculate-boosts.ftl" />
    </linkset>
    <script src="chrome://browser/content/oculate-components/windows/oculate-boost-receive.js"></script>

    <html:div class="zbs-card">
      <html:div class="zbs-header">
        <html:div class="zbs-header-domain">
          <html:p data-l10n-id="oculate-boost-receive-made-for"></html:p>
          <html:b class="zbs-domain"></html:b>
        </html:div>
      </html:div>

      <html:div class="zbs-top">
        <html:div class="zbs-info">
          <html:img class="zbs-favicon" draggable="false" />
          <html:div class="zbs-info-text">
            <svg xmlns="http://www.w3.org/2000/svg" class="zbs-signature"></svg>
            <html:p class="zbs-name"></html:p>
            <html:div class="zbs-author">
              <html:i data-l10n-id="oculate-boost-receive-by"></html:i>
              <html:b class="zbs-author-name"></html:b>
            </html:div>
          </html:div>
          <button class="zbs-info-button" noinitialfocus="true" data-l10n-id="oculate-boost-receive-info" />
        </html:div>

        <html:div class="zbs-content">
          <html:div class="zbs-pane">
            <html:div class="zbs-screenshot">
              <html:img class="zbs-screenshot-image" draggable="false" />
              <html:img class="zbs-screenshot-favicon" draggable="false" />
            </html:div>
          </html:div>
        </html:div>
      </html:div>

      <html:div class="zbs-footer">
        <html:div class="zbs-footer-text">
          <html:h1 data-l10n-id="oculate-boost-receive-title"></html:h1>
          <html:p data-l10n-id="oculate-boost-receive-description">
            <html:span class="zbs-library" data-l10n-name="library"></html:span>
          </html:p>
        </html:div>
      </html:div>
    </html:div>

    <popupset>
      <panel type="arrow" class="zbs-info-panel" id="oculate-boost-receive-info-panel">
        <html:p data-l10n-id="oculate-boost-receive-info-text" data-l10n-args='{"domain": ""}'></html:p>
      </panel>
    </popupset>
  </dialog>
</window>

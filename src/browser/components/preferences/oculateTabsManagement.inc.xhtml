<html:template id="template-paneOculateTabManagement">
<hbox id="OculateWorkspacesCategory"
      class="subcategory"
      hidden="true"
      data-category="paneOculateTabManagement">
</hbox>

<hbox id="oculateTabManagementCategory"
      class="subcategory"
      hidden="true"
      data-category="paneOculateTabManagement">
<html:h1 data-l10n-id="pane-settings-workspaces-title"/>
</hbox>

<groupbox id="oculateWorkspacesGroup" data-category="paneOculateTabManagement" hidden="true" class="highlighting-group">
      <label><html:h2 data-l10n-id="oculate-settings-workspaces-header"/></label>
      <description class="description-deemphasized" data-l10n-id="oculate-settings-workspaces-description" />

      <checkbox id="oculateWorkspacesSyncUnpinnedTabs"
            data-l10n-id="oculate-settings-workspaces-sync-unpinned-tabs"
            preference="oculate.window-sync.sync-only-pinned-tabs"/>
      <checkbox id="oculateWorkspacesHideDefaultContainer"
            data-l10n-id="oculate-settings-workspaces-hide-default-container-indicator"
            preference="oculate.workspaces.hide-default-container-indicator"/>
      <checkbox id="oculateWorkspacesForceContainerTabsToWorkspace"
            data-l10n-id="oculate-settings-workspaces-force-container-tabs-to-workspace"
            preference="oculate.workspaces.force-container-workspace"/>
      <checkbox id="oculateTabsCloseOnBackWithNoHistory"
            data-l10n-id="oculate-tabs-close-on-back-with-no-history"
            preference="oculate.tabs.close-on-back-with-no-history"/>
      <checkbox data-l10n-id="oculate-tabs-cycle-ignore-pending-tabs"
            preference="oculate.tabs.ctrl-tab.ignore-pending-tabs"/>
      <checkbox data-l10n-id="oculate-tabs-cycle-by-attribute"
            preference="oculate.tabs.ctrl-tab.ignore-essential-tabs"/>
      <description id="oculateTabsCycleByAttributeWarning"
            class="description-deemphasized"
            data-l10n-id="oculate-tabs-cycle-by-attribute-warning"
            hidden="true"/>
      <checkbox data-l10n-id="oculate-tabs-select-recently-used-on-close"
            preference="oculate.tabs.select-recently-used-on-close"/>
</groupbox>

<hbox id="oculatePinnedTabsManagerCategory"
      class="subcategory"
      hidden="true"
      data-category="paneOculateTabManagement">
      <html:h1 data-l10n-id="pane-oculate-pinned-tab-manager-title"/>
</hbox>

<groupbox id="oculatePinnedTabsManagerGroup" data-category="paneOculateTabManagement" hidden="true" class="highlighting-group">
      <label><html:h2 data-l10n-id="oculate-pinned-tab-manager-header"/></label>
      <description class="description-deemphasized" data-l10n-id="oculate-pinned-tab-manager-description" />

      <checkbox id="oculatePinnedTabRestorePinnedTabsToPinnedUrl"
                data-l10n-id="oculate-pinned-tab-manager-restore-pinned-tabs-to-pinned-url"
                preference="oculate.pinned-tab-manager.restore-pinned-tabs-to-pinned-url"/>
      <checkbox id="oculatePinnedTabContainerSpecificEssentials"
                data-l10n-id="oculate-pinned-tab-manager-container-specific-essentials-enabled"
                preference="oculate.workspaces.separate-essentials"/>

      <hbox align="center">
            <label id="oculatePinnedTabCloseShortcutBehaviorLabel" data-l10n-id="oculate-pinned-tab-manager-close-shortcut-behavior-label"/>
            <menulist id="oculatePinnedTabCloseShortcutBehavior" preference="oculate.pinned-tab-manager.close-shortcut-behavior">
                  <menupopup>
                        <menuitem data-l10n-id="oculate-pinned-tab-manager-reset-unload-switch-close-shortcut-option" value="reset-unload-switch"/>
                        <menuitem data-l10n-id="oculate-pinned-tab-manager-unload-switch-close-shortcut-option" value="unload-switch"/>
                        <menuitem data-l10n-id="oculate-pinned-tab-manager-reset-switch-close-shortcut-option" value="reset-switch"/>
                        <menuitem data-l10n-id="oculate-pinned-tab-manager-switch-close-shortcut-option" value="switch"/>
                        <menuitem data-l10n-id="oculate-pinned-tab-manager-reset-close-shortcut-option" value="reset"/>
                        <menuitem data-l10n-id="oculate-pinned-tab-manager-close-close-shortcut-option" value="close"/>
                  </menupopup>
            </menulist>
      </hbox>
</groupbox>

</html:template>
